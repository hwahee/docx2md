name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-bun reads `packageManager`, setup-node reads `engines.node` (package.json).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier (format check)
        run: bun run format:check

      - name: ESLint
        run: bun run lint

      - name: TypeScript (strict typecheck)
        run: bun run typecheck

      - name: Knip (unused files/exports/dependencies)
        run: bun run knip

      # The git and watch tests drive a real git binary and the real file system.
      - name: Tests
        run: bun test
